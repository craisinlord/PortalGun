plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
}

base {
    archivesName = "${mod_id}-fabric-1.21.1"
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs project(':common-1.21.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-1.21.1').sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version_1_21_1}"
    modImplementation(files("$rootDir/anthology_jars/anthology-${anthology_version}+1.21.1-fabric.jar"))
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'portal_gun.refmap.json'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version           : project.version,
        minecraft_version : '1.21.1',
        mod_id            : mod_id,
        mod_name          : mod_name,
        mod_description   : mod_description,
        mod_authors       : mod_authors,
        mod_license       : mod_license,
        homepage_url      : homepage_url,
        logo_file         : logo_file
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    doLast {
        ['portal_gun.mixins.json', 'portal_gun-fabric.mixins.json'].each { configName ->
            def mixinConfig = new File(destinationDir, configName)
            def json = new groovy.json.JsonSlurper().parse(mixinConfig)
            json.put('refmap', 'portal_gun.refmap.json')
            mixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}


dependencies {
    modRuntimeOnly "maven.modrinth:sodium:mc1.21.1-0.8.13-fabric"
}
