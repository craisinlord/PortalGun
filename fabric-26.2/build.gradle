plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

base {
    archivesName = "${mod_id}-fabric-26.2"
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs project(':common-26.2').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-26.2').sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26_2}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version_26_2}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26_2}"
    implementation "curse.maven:geckolib-${geckolib_curseforge_id}:${geckolib_curseforge_file_id_fabric_26_2}"
    implementation files("$rootDir/anthology_jars/anthology-${anthology_version}+26.2-fabric.jar")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version           : project.version,
        minecraft_version : minecraft_version_26_2,
        mod_id            : mod_id,
        mod_name          : mod_name,
        mod_description   : mod_description,
        mod_authors       : mod_authors,
        mod_license       : mod_license,
        homepage_url      : homepage_url,
        logo_file         : logo_file
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

