plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def rootProperties = new Properties()
file('../gradle.properties').withInputStream { rootProperties.load(it) }
rootProperties.each { key, value ->
    if (!project.hasProperty(key)) {
        project.ext.set(key, value)
    }
}

group = mod_group_id
version = mod_version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    flatDir {
        dir file('../anthology_jars')
    }
}

base { archivesName = "${mod_id}-forge-1.20.1" }

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'parchment', version: parchment_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            jvmArgs(
                "-Dmixin.env.remapRefMap=true",
                "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
            )
        }
        server {
            jvmArgs(
                "-Dmixin.env.remapRefMap=true",
                "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
            )
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java.srcDirs += file('../common-1.20.1/src/main/java')
        resources.srcDirs += file('../common-1.20.1/src/main/resources')
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("local:anthology:${anthology_version}+1.20.1-forge")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras}"))
    implementation "io.github.llamalad7:mixinextras-forge:${mixin_extras}"
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version: project.version,
        minecraft_version: minecraft_version,
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        anthology_version: anthology_version,
        geckolib_version: geckolib_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }

    doLast {
        ["${mod_id}.mixins.json"].each { configName ->
            var mixinConfig = new File(destinationDir, configName)
            var json = new groovy.json.JsonSlurper().parse(mixinConfig)
            json.put('refmap', "${mod_id}.refmap.json")
            mixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
