plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-neoforge-26.2"
}

neoForge {
    version = neoforge_version_26_2
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { client() }
        server { server() }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    main {
        java {
            srcDirs project(':common-26.2').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-26.2').sourceSets.main.resources.srcDirs
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:geckolib-${geckolib_curseforge_id}:${geckolib_curseforge_file_id_neoforge_26_2}"
    implementation files(rootProject.file("anthology_jars/anthology-${anthology_version}+26.2-neoforge.jar"))
}



configurations {
    sodiumRuntime
}

neoForge.runs.named('client') {
    additionalRuntimeClasspathConfiguration.extendsFrom(configurations.sodiumRuntime)
}

dependencies {
    sodiumRuntime files(rootProject.file('libs/sodium-neoforge-0.9.2+mc26.2.jar'))
}
